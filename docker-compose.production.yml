services:
  api:
    build: { context: ./festo-backend, dockerfile: Dockerfile }
    restart: unless-stopped
    command: sh -c "npm run migrate:up && npm run seed:directory && npm run start:api"
    ports: ["${API_PORT:-5000}:5000"]
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?Set a 32+ character JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${FRONTEND_URL:?Set the HTTPS frontend URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set the HTTPS frontend URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Festo <events@example.com>}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: { context: ./festo-backend, dockerfile: Dockerfile }
    restart: unless-stopped
    command: npm run start:worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?Set a 32+ character JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Festo <events@example.com>}
  frontend:
    build:
      context: ./festo-frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: "${VITE_API_URL:?Set the HTTPS API URL}"
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-8080}:8080"]
    depends_on:
      api:
        condition: service_healthy
